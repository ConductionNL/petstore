# app-tests-live.yml — petstore caller for the LIVE-NC reusable workflow.
#
# Boots a real, seeded Nextcloud (db + NC + openregister deployed/enabled +
# petstore deployed/enabled), then runs the deep Playwright e2e
# (tests/e2e/workflows/) and/or the Newman API-contract suite against it as
# HARD gates. Generalised per GAP-2 (arm CI live-gating) from openregister's
# reference rig; the reusable tests-live.yml is byte-identical fleet-wide, only
# these inputs differ. Additive — does not touch app-tests.yml / release /
# pre-merge workflows.
#
# Gate status for petstore (see TESTING-CI-ROLLOUT.md for the evidence table):
#   deep-e2e: true  — e2e _fixtures uses register slug 'petstore', run-id-prefixed cleanup; not live-verified this pass
#   newman:   true   — ARMED: tests/integration/run-newman.sh runs the app-template collection
#                     (minimal self-contained health/contract baseline; parameterised by base_url).
#                     Verified live (localhost:8080): 1 request / 1 assertion, 0 failures.

name: app-tests-live

on:
  pull_request:
    branches:
      - development
      - main
      - beta
  push:
    branches:
      - development
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    uses: ./.forgejo/workflows/tests-live.yml
    with:
      app-id: petstore
      is-openregister: false
      run-e2e: true
      run-newman: true
      # NON-GATING (GAP-5): runs the visual-regression project + uploads
      # snapshots/diffs as an artifact. Committed baselines are dev-container
      # native, so they won't byte-match the CI Linux runner until regenerated
      # in-CI (see tests-live.yml run-visual caveat) — continue-on-error.
      run-visual: true
      newman-entrypoint: tests/integration/run-newman.sh

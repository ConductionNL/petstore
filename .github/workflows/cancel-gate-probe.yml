name: Cancel Gate Probe

# TEMPORARY PROBE — delete after use.
#
# Establishes, empirically rather than from memory, what GitHub's expression
# context actually reports in the two shapes of cancellation the shared
# Quality Report gate has to tell apart:
#
#   (a) a single job cancelled while its RUN carries on  -> must fail the gate
#   (b) the WHOLE run cancelled by concurrency supersession -> must stay quiet
#
# `dep` carries its own job-level `concurrency` group, so pushing twice in
# quick succession cancels the FIRST run's `dep` job without cancelling the
# first run itself. That reproduces shape (a) on demand.

on:
  push:
    branches: [probe/cancel-gate**]

# PHASE 2 — shape (b). Workflow-level concurrency, exactly like quality.yml.
# A second push now supersedes and cancels the WHOLE first run, not just one
# job. The `report` job still executes because `if: always()` runs a job even
# when its run is cancelled — which is precisely why the aggregate goes green
# on superseded runs today. `cancelled()` must be TRUE here, so the
# `!cancelled()`-guarded gate must be SKIPPED and `report` must NOT fail.
concurrency:
  group: cancel-gate-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: sleep 240

  sibling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "sibling produced a real verdict"

  report:
    runs-on: ubuntu-latest
    needs: [dep, sibling]
    if: always()
    timeout-minutes: 5
    steps:
      # `cancelled()` may only appear in an `if:` — actionlint:
      # 'calling function "cancelled" is not allowed here'. So its value is
      # read out through two mutually exclusive guarded steps rather than
      # interpolated into a run block.
      - name: cancelled() is TRUE
        if: ${{ cancelled() }}
        run: |
          echo "PROBE cancelled() = TRUE"

      - name: cancelled() is FALSE
        if: ${{ !cancelled() }}
        run: |
          echo "PROBE cancelled() = FALSE"

      - name: Dump expression context
        if: always()
        run: |
          echo "PROBE needs.dep.result = ${{ needs.dep.result }}"
          echo "PROBE contains-failure = ${{ contains(needs.*.result, 'failure') }}"
          echo "PROBE contains-cancel  = ${{ contains(needs.*.result, 'cancelled') }}"
          echo "PROBE needs JSON       = ${{ toJSON(needs) }}"

      - name: Gate — fail when any upstream job failed
        if: ${{ always() && contains(needs.*.result, 'failure') }}
        run: |
          echo "PROBE VERDICT: failure-gate FIRED"
          exit 1

      - name: Gate — fail when an upstream job was cancelled mid-run
        if: ${{ !cancelled() && contains(needs.*.result, 'cancelled') }}
        run: |
          echo "PROBE VERDICT: cancelled-gate FIRED"
          exit 1

      - name: Reached the end
        if: always()
        run: |
          echo "PROBE VERDICT: report reached the end without firing a gate"

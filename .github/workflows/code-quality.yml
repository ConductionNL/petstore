name: Code Quality

# THROWAWAY BRANCH — proof harness for ConductionNL/.github#121.
# Points at the fix branch of the reusable workflow and strips every leg that
# is not the PHP quality matrix, so the run is cheap and the phpcs leg is the
# only thing under test. DO NOT MERGE.

on:
  push:
    branches: [main, development, feature/**, bugfix/**, hotfix/**]
  pull_request:
    branches: [main, master, development, beta]
  workflow_dispatch:

jobs:
  quality:
    uses: ConductionNL/.github/.github/workflows/quality.yml@main
    with:
      app-name: petstore
      php-version: "8.3"
      enable-psalm: false
      enable-phpstan: false
      enable-phpmetrics: false
      enable-phpmd: false
      enable-phpcs: true
      enable-frontend: false
      enable-eslint: false
      frontend-checks: '[]'
      enable-phpunit: false
      enable-newman: false
      enable-license-check: false
      enable-sbom: false

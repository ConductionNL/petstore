name: Code Quality

on:
  push:
    branches: [main, development, feature/**, bugfix/**, hotfix/**]
  pull_request:
    branches: [main, master, development, beta]
  workflow_dispatch:

jobs:
  quality:
    # TEMPORARY — pinned to a branch, not @main, to verify the cancelled-job
    # gate fix on ONE repo before it can propagate to all ~13 callers.
    # Revert to @main before merging.
    uses: ConductionNL/.github/.github/workflows/quality.yml@fix/quality-cancelled-dep-fails-gate
    with:
      # Was `app-template`, a leftover from the scaffold this repo was cloned
      # from. The shared workflow checks the repo out at
      # `server/apps/${{ inputs.app-name }}` and resolves every artifact path
      # (e.g. the Playwright report upload) from it, so the whole pipeline ran
      # against a directory that is not this app's id.
      app-name: petstore
      php-version: "8.3"
      php-test-versions: '["8.3", "8.4"]'
      nextcloud-test-refs: '["stable31", "stable32", "stable33"]'
      enable-psalm: true
      enable-phpstan: true
      enable-phpmetrics: true
      enable-frontend: true
      enable-eslint: true
      # `frontend-checks` defaults to [], so petstore's Vitest suite (15 tests
      # across the settings store and two mounted SFCs) and its manifest /
      # register / registry validators had NEVER run on a pull request — only
      # eslint and stylelint did. Both scripts are self-contained (each leg is a
      # fresh checkout + `npm ci`).
      frontend-checks: '["test:unit", "check:specs"]'
      enable-phpunit: true
      enable-newman: true
      # petstore stores every pet, category and order as an OpenRegister object
      # (register `petstore`), so OpenRegister has to be present for the app to
      # do anything at all. Without it the SPA still boots and the E2E suite
      # fails as a wall of 404s from the object API.
      additional-apps: '[{"repo":"ConductionNL/openregister","app":"openregister","ref":"development"}]'
      enable-sbom: true

      # ── E2E browser tests ────────────────────────────────────────────────
      # `enable-playwright` was unset, so the shared workflow reported this job
      # as `skipped` on every run — and a skipped check reads exactly like a
      # passing one. tests/e2e/ has been carrying 5 gating spec files that had
      # never executed in CI.
      #
      # `playwright-test-path` stays at its default (`tests/e2e`). The shared
      # workflow uses it twice: to assert tests exist, and to locate a config —
      # first `tests/e2e/playwright.config.ts`, then the repo root. petstore has
      # no config under tests/e2e, so the root `playwright.config.ts` is used.
      # Its `chromium` project runs spec-coverage/ + workflows/ and testIgnores
      # both docs-screenshots.spec.ts (journeydoc capture, ADR-030 — reshooting
      # screenshots on every push is not a gate) and visual/ (PNG baselines are
      # host-font/GPU specific and cannot byte-match a Linux runner).
      enable-playwright: true
      # The register import is NOT left to `occ app:enable`. That runs the
      # InitializeSettings repair step with no user session, so OpenRegister's
      # RBAC can deny it, and the step catches \Throwable and downgrades the
      # failure to a warning while `occ` still exits 0. See ci-seed.sh — it
      # imports over the admin HTTP API and then verifies the register and the
      # `pet` / `category` / `order` schemas actually exist.
      playwright-seed-command: 'bash apps/petstore/tests/e2e/ci-seed.sh'

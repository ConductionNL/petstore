name: Branch Protection

on:
  pull_request:
    branches: [main, beta]

jobs:
  # Job id must stay `branch-protection` so the check reports as
  # `branch-protection / check-branch`, which is the context name the org
  # rulesets require on main and beta. GitHub names a reusable-workflow
  # context `<caller-job-id> / <called-job-name>`, so renaming this job
  # silently detaches the required status check and leaves PRs permanently
  # pending — a dead gate whose absence looks exactly like its success.
  branch-protection:
    uses: ConductionNL/.github/.github/workflows/branch-protection.yml@main
    secrets: inherit